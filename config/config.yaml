# =====================================================================
#  Configuración de la tarea U2_T2 — Métodos abiertos
# ---------------------------------------------------------------------
#  Todo lo que se ajusta sin tocar código vive aquí: los pesos, las
#  tolerancias y la URL del webhook. Los enunciados de los ejercicios
#  están en profe/ejercicios/*.md y los bancos teóricos en preguntas.yaml.
# =====================================================================
tarea:
  # `id` es el nombre de la PESTAÑA en la hoja de cálculo (el Apps Script
  # escribe ahí) y también la parte que fija la semilla del alumno.
  id: "U2_T2_Metodos_abiertos"
  nombre: "Unidad 2 - Tarea 2: Métodos Abiertos"
  materia: "Métodos Numéricos"

ponderacion:
  automatico: 0.70
  manual: 0.30

evaluacion:
  tolerancia_simple: 1e-6          # respuestas numéricas (relativa)
  tolerancia_funcion: 1e-4         # raíz devuelta por las funciones del alumno
  min_aprobacion: 0.90             # 90 % de los 20 puntos para poder enviar
  max_intentos: 2                  # envíos permitidos (lo impone el Apps Script)
  max_iter: 60                     # iteraciones de la tabla de referencia
  criterios_paro: [0.01, 0.1, 0.001]   # εs (%) que se sortean en las preguntas
  accion: "guardar"
  webhook_token: "43f6f220-fc6e-4972-a69e-a11b54a629ec"
  apps_script_url: "https://script.google.com/macros/s/AKfycbzD5k2BVwJ6pHjBgbc3-f1pbV9zrX0AloZfPiCyHSrsRZ7Kfno6ZQOnqzEbTikVlO6lRQ/exec"

# 14 preguntas = 20 puntos: cada método aporta 2 puntos (programar la función
# con casos ocultos) + 1 punto (pregunta de iteraciones sobre esa misma
# función). El código va PRIMERO: la pregunta de iteraciones se contesta
# ejecutando la función que el alumno acaba de escribir, no contando a mano
# (la actividad a mano solo pide las 3 primeras iteraciones).
